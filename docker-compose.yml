services:
  anchor:
    build: .
    container_name: anchor
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - anchor_data:/app/anchor_data
    environment:
      - ANCHOR_MODE=both
      - ANCHOR_DASHBOARD_PASSWORD=${ANCHOR_DASHBOARD_PASSWORD:-}
      - ANCHOR_API_KEY=${ANCHOR_API_KEY:-}
      - ANCHOR_LLM=${ANCHOR_LLM:-}
      - ANCHOR_LLM_API_KEY=${ANCHOR_LLM_API_KEY:-}
      - ANCHOR_LLM_ENDPOINT=${ANCHOR_LLM_ENDPOINT:-}
    restart: unless-stopped
    mem_limit: 2g

volumes:
  anchor_data:
